# Copy this file to your SITE repo at .github/workflows/hugo.yml
name: Deploy Hugo site to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # Diagram fences render through the @reonarudo/<name>-renderer libraries, which
      # package.json pins as git dependencies; no native pikchr or gnuplot is installed.
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci

      - name: Pre-render diagram fences
        run: npm run diagrams

      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: '0.166.0', extended: true }
      - uses: actions/configure-pages@v5
        id: pages
      - run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./public }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
